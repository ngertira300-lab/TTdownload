<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TTDown - TikTok Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .logo span {
      color: #ff1744;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #222;
    }

    .description {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #ff1744;
    }

    .paste {
      border: none;
      padding: 0 14px;
      border-radius: 10px;
      background: #eee;
      font-weight: bold;
      cursor: pointer;
    }

    .download {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .download:disabled {
      opacity: 0.6;
    }

    .loading {
      display: none;
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
    }

    .result h3 {
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-bottom: 12px;
    }

    .save {
      display: block;
      text-decoration: none;
      background: #ff1744;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-weight: bold;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #ffe5e5;
      color: #d00000;
      font-size: 13px;
    }

    .info {
      margin-top: 25px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      TT<span>Down</span>
    </div>

    <h1>TikTok Downloader</h1>

    <p class="description">
      Tempel link TikTok untuk mendapatkan video.
    </p>

    <div class="input-area">

      <input
        id="url"
        type="text"
        placeholder="Tempel link TikTok..."
      >

      <button
        class="paste"
        onclick="pasteLink()">
        Paste
      </button>

    </div>

    <button
      id="downloadButton"
      class="download"
      onclick="downloadVideo()">
      Download
    </button>

    <div
      id="loading"
      class="loading">
      Memproses video...
    </div>

    <div
      id="error"
      class="error">
    </div>

    <div
      id="result"
      class="result">

      <h3>Video siap</h3>

      <video
        id="video"
        controls>
      </video>

      <a
        id="save"
        class="save"
        target="_blank"
        rel="noopener">
        Buka / Simpan Video
      </a>

    </div>

    <div class="info">
      Gunakan hanya untuk konten yang kamu miliki
      atau memiliki izin untuk mengunduh.
    </div>

  </div>


  <script>

    async function pasteLink() {

      try {

        const text =
          await navigator.clipboard.readText();

        document.getElementById("url").value = text;

      } catch (error) {

        alert("Clipboard tidak bisa dibaca. Silakan tempel link secara manual.");

      }

    }


    async function downloadVideo() {

      const url =
        document.getElementById("url").value.trim();

      const button =
        document.getElementById("downloadButton");

      const loading =
        document.getElementById("loading");

      const result =
        document.getElementById("result");

      const errorBox =
        document.getElementById("error");

      const video =
        document.getElementById("video");

      const save =
        document.getElementById("save");


      errorBox.style.display = "none";
      result.style.display = "none";


      if (url === "") {

        showError("Tempel link TikTok terlebih dahulu.");

        return;

      }


      if (!url.includes("tiktok.com")) {

        showError("Link yang dimasukkan bukan link TikTok.");

        return;

      }


      button.disabled = true;
      button.textContent = "Memproses...";
      loading.style.display = "block";


      try {

        const response =
          await fetch("/api/download", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              url: url
            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "Gagal mengambil video."
          );

        }


        if (!data.videoUrl) {

          throw new Error(
            "URL video tidak ditemukan."
          );

        }


        video.src = data.videoUrl;

        save.href = data.videoUrl;

        result.style.display = "block";


      } catch (error) {

        showError(error.message);

      } finally {

        button.disabled = false;

        button.textContent = "Download";

        loading.style.display = "none";

      }

    }


    function showError(message) {

      const errorBox =
        document.getElementById("error");

      errorBox.textContent = message;

      errorBox.style.display = "block";

    }

  </script>

</body>
</html>
